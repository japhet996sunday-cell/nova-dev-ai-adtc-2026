name: ADTC Benchmark
on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install llama-bench
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git
          git clone https://github.com/ggerganov/llama.cpp
          cd llama.cpp && cmake -B build -DLLAMA_CUBLAS=OFF && cmake --build build --config Release -j4
          sudo cp build/bin/llama-bench /usr/local/bin/

      - name: Install ADTC Profiler
        run: python3 -m pip install "git+https://github.com/Africa-Deep-Tech-Foundation/adtc-profiler.git"

      - name: Run ADTC Benchmark
        run: adtc-profiler run --submission . --mode participant --output submission.json

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: submission.json

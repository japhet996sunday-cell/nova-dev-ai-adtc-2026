name: ADTC Benchmark
on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install build wheel

      - name: Install ADTC Profiler
        run: |
          curl -L https://github.com/adtc-ai/profiler/releases/latest/download/adtc_profiler-0.2.1-py3-none-any.whl -o profiler.whl
          pip install profiler.whl

      - name: Run ADTC Benchmark
        run: adtc-profiler mode=participant --model ./model/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf --output results.json

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: results.json

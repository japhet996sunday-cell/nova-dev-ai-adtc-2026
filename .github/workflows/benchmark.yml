name: ADTC Benchmark

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout submission
        uses: actions/checkout@v4

      - name: Show runner hardware
        run: |
          echo "=== CPU ==="
          lscpu | grep -E 'Model name|CPU\(s\)|Thread|Core'
          echo
          echo "=== MEMORY ==="
          free -h
          echo
          echo "=== DISK ==="
          df -h

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git

      - name: Clone llama.cpp
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git
          cd llama.cpp
          git rev-parse HEAD

      - name: Build llama-bench
        run: |
          cd llama.cpp
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=ON

          cmake --build build \
            --config Release \
            --target llama-bench \
            -j2

          ./build/bin/llama-bench --help | head -40

          sudo cp ./build/bin/llama-bench /usr/local/bin/llama-bench

      - name: Verify llama-bench
        run: |
          command -v llama-bench
          ls -lh "$(command -v llama-bench)"
          llama-bench --help | head -20

      - name: Install ADTC Profiler
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install \
            "git+https://github.com/Africa-Deep-Tech-Foundation/adtc-profiler.git"

        - name: Download model
        timeout-minutes: 15
        run: |
          echo "========================================"
          echo "DOWNLOADING MODEL"
          echo "========================================"

          chmod +x download_model.sh
          bash download_model.sh

          echo
          echo "Downloaded model:"
          ls -lh model/

          echo
          echo "Checking expected model:"
          test -f model/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf

          echo "MODEL DOWNLOAD SUCCESS"


      - name: Verify submission
        run: |
          echo "=== Submission files ==="
          find . -maxdepth 2 -type f | sort
          echo
          echo "=== Model ==="
          find model -maxdepth 1 -type f -ls || true
          echo
          echo "=== Metadata ==="
          python3 -m json.tool metadata.json > /dev/null
          echo "metadata.json is valid JSON"

      - name: Run ADTC Benchmark
        run: |
          mkdir -p benchmark-output

          echo "Starting ADTC profiler..."
          echo "Start time: $(date)"

          adtc-profiler run \
            --submission . \
            --mode participant \
            --output submission.json

          echo "Finished: $(date)"

      - name: Display results
        if: always()
        run: |
          echo "=== submission.json ==="
          if [ -f submission.json ]; then
            cat submission.json
          else
            echo "submission.json was not produced"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            submission.json
            benchmark-output/**
          if-no-files-found: warn

name: ADTC Benchmark
on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install build wheel
          
      - name: Install ADTC Profiler
        run: |
          git clone https://github.com/adtc-org/adtc-profiler.git
          cd adtc-profiler
          pip install -e .
          
      - name: Run ADTC Benchmark
        run: adtc-profiler run --model ./model --output results.json
        
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: results.json

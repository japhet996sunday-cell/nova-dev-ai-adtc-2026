name: ADTC Benchmark
on: workflow_dispatch

jobs:
  run-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          pip install adtc-profiler llama-cpp-python
      
      - name: Run ADTC Profiler
        run: |
          adtc-profiler run --submission . --mode participant --output submission-x86.json
      
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: x86-benchmark-result
          path: submission-x86.json

name: ADTC Benchmark
on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install adtc-profiler
        run: pip install --upgrade pip && pip install adtc-profiler
      - name: Run ADTC Benchmark
        run: adtc-profiler run --model ./model --output submission-x86.json
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: submission-x86.json
